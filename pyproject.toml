[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-blink-client"
version = "2.0.0"
description = "Python client for the Blink Markets CLOB API — Polymarket drop-in compatible"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "aiohttp>=3.9,<4",
    "httpx>=0.27,<1",
    "msgspec>=0.18,<1",
    "orjson>=3.9,<4",
    "eth-account>=0.13,<1",
    "coincurve>=20,<21",
    "websockets>=13,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3",
    "aioresponses>=0.7",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["py_blink_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
